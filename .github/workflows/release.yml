name: Release

# Pushing a tag such as v0.1.0 builds, signs and notarises the macOS
# installer, builds the Windows plug-ins, and puts both in a draft GitHub
# release for you to check and publish. Signing needs these repository secrets:
#
#   MACOS_APPLICATION_P12       base64 of your "Developer ID Application" certificate, exported as .p12
#   MACOS_INSTALLER_P12         base64 of your "Developer ID Installer" certificate, exported as .p12
#   MACOS_P12_PASSWORD          the password both .p12 files were exported with
#   MACOS_APPLICATION_IDENTITY  the certificate's full name, e.g. "Developer ID Application: Jo Bloggs (AB12CD34EF)"
#   MACOS_INSTALLER_IDENTITY    likewise, e.g. "Developer ID Installer: Jo Bloggs (AB12CD34EF)"
#   NOTARY_API_KEY              base64 of an App Store Connect API key (.p8) with the Developer role
#   NOTARY_API_KEY_ID           that key's ID
#   NOTARY_API_ISSUER_ID        your App Store Connect issuer ID

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macOS installer
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ARTEFACTS: build/Livecut_artefacts/Release
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Check release version
        run: cmake -DRELEASE_TAG="$GITHUB_REF_NAME" -P packaging/check-release-version.cmake

      - name: Check signing secrets
        env:
          MACOS_APPLICATION_P12: ${{ secrets.MACOS_APPLICATION_P12 }}
          MACOS_INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          MACOS_APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          missing=0
          for name in MACOS_APPLICATION_P12 MACOS_INSTALLER_P12 MACOS_P12_PASSWORD MACOS_APPLICATION_IDENTITY \
                      MACOS_INSTALLER_IDENTITY NOTARY_API_KEY NOTARY_API_KEY_ID NOTARY_API_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is not set, so the installer can't be signed and notarised."
              missing=1
            fi
          done
          exit $missing

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel "$(sysctl -n hw.logicalcpu)"

      - name: Unit tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Import signing certificates
        env:
          MACOS_APPLICATION_P12: ${{ secrets.MACOS_APPLICATION_P12 }}
          MACOS_INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          for certificate in MACOS_APPLICATION_P12 MACOS_INSTALLER_P12; do
            printf '%s' "${!certificate}" | base64 --decode > "$RUNNER_TEMP/$certificate.p12"
            security import "$RUNNER_TEMP/$certificate.p12" -k "$keychain" -P "$MACOS_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild
            rm "$RUNNER_TEMP/$certificate.p12"
          done

          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Build signed installer
        env:
          MACOS_APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: |
          packaging/macos/make-installer.sh "$ARTEFACTS" "${GITHUB_REF_NAME#v}" dist \
            --sign "$MACOS_APPLICATION_IDENTITY" "$MACOS_INSTALLER_IDENTITY"

      - name: Notarise and staple
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_API_KEY" | base64 --decode > "$key"
          installer="dist/Livecut-${GITHUB_REF_NAME#v}.pkg"
          xcrun notarytool submit "$installer" --key "$key" --key-id "$NOTARY_API_KEY_ID" \
            --issuer "$NOTARY_API_ISSUER_ID" --wait --timeout 30m
          rm "$key"
          xcrun stapler staple "$installer"
          spctl --assess --type install --verbose=2 "$installer"

      - name: Remove signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          if [ -e "$keychain" ]; then
            security delete-keychain "$keychain"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: macos-installer
          path: dist/*.pkg
          if-no-files-found: error

  windows:
    name: Windows plug-ins
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    env:
      ARTEFACTS: build/Livecut_artefacts/Release
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Check release version
        run: cmake -DRELEASE_TAG="$GITHUB_REF_NAME" -P packaging/check-release-version.cmake

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel "$NUMBER_OF_PROCESSORS"

      - name: Unit tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Package
        run: |
          mkdir -p dist/Livecut
          cp -R "$ARTEFACTS/VST3/Livecut.vst3" dist/Livecut/
          cp "$ARTEFACTS/Standalone/Livecut.exe" dist/Livecut/
          cp LICENSE dist/Livecut/
          (cd dist && 7z a "Livecut-${GITHUB_REF_NAME#v}-windows-x64.zip" Livecut)

      - uses: actions/upload-artifact@v7
        with:
          name: windows-plugins
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Releases start as drafts, so a person checks them before anyone can
          # download them. Versions with a suffix, such as v0.1.0-rc.1, are pre-releases.
          options=(--draft --title "Livecut ${GITHUB_REF_NAME#v}" --generate-notes)

          if [[ $GITHUB_REF_NAME == *-* ]]; then
            options+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" "${options[@]}"
